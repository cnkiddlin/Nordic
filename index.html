<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>北欧之旅 · 2026</title>
<style>
:root{
  --ink:#1c2b36;
  --muted:#5d6d7b;
  --line:#dce5ec;
  --bg:#f2f5f8;
  --card:#ffffff;
  --teal:#0f766e;
  --teal-soft:#e4f2f0;
  --navy:#23455f;
  --coral:#d95d39;
  --gold:#d99a2b;
  --sky:#2e86ab;
  --radius:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
svg{display:block}
.wrap{max-width:1120px;margin:0 auto;padding:14px 16px 48px}
.tab-panel[hidden]{display:none}

.masthead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 14px;
  padding:12px 20px;
  background:var(--card);
  border-bottom:1px solid var(--line);
  border-radius:0;
  max-width:none;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 0 auto}
.brand-mark{
  width:34px;height:34px;border-radius:var(--radius);
  background:var(--teal);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.brand b{display:block;font-size:16px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px}
.masthead nav{
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  gap:6px;
  justify-content:flex-end;
  min-width:0;
  flex:1 1 auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.masthead nav::-webkit-scrollbar{display:none}
.masthead nav button{
  font:inherit;
  font-size:12px;line-height:1;padding:7px 9px;
  color:var(--navy);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;background:#fff;
  cursor:pointer;
  white-space:nowrap;
}
.masthead nav button:hover{border-color:var(--teal);color:var(--teal)}
.masthead nav button.active{background:var(--teal);color:#fff;border-color:var(--teal)}

.now-card{
  position:relative;
  overflow:hidden;
  padding:22px 22px 26px;
  border-radius:var(--radius);
  color:#fff;
  background:
    radial-gradient(circle at 82% 18%, rgba(255,255,255,.16) 0, rgba(255,255,255,0) 34%),
    linear-gradient(135deg,#123b4c 0%,#0f766e 100%);
}
.now-card::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.12;
  background-image:
    linear-gradient(rgba(255,255,255,.7) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.7) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(90deg, transparent 40%, #000 100%);
}
.now-eyebrow{
  position:relative;
  margin:20px 0 2px;
  font-size:12px;font-weight:700;opacity:.82;letter-spacing:1px;
}
.now-title{
  position:relative;
  margin:0;
  font-size:clamp(24px, 5vw, 42px);
  line-height:1.15;
  letter-spacing:0;
}
.now-meta{
  position:relative;
  margin:8px 0 0;
  font-size:14px;opacity:.92;
}
.countdown{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:20px;
}
.cd-cell{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);
  border-radius:var(--radius);
  padding:12px 8px 10px;
  text-align:center;
  min-width:0;
}
.cd-cell b{
  display:block;
  font-size:clamp(30px, 7vw, 54px);
  line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:0;
}
.cd-cell span{display:block;margin-top:6px;font-size:12px;opacity:.8}
.section{margin-top:36px;scroll-margin-top:16px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.section-head h2{font-size:20px;margin:0;letter-spacing:0}
.section-head span{font-size:13px;color:var(--muted);white-space:nowrap}

.grid{display:grid;gap:10px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}

.clean-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  min-width:0;
}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.kicker{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.code{font-size:16px;color:var(--teal);letter-spacing:.4px}
.clean-card h3{font-size:15px;margin:0 0 4px;line-height:1.35}
.clean-card h3 a{text-decoration:none}
.clean-card h3 a:hover{color:var(--teal)}
.desc{font-size:12px;color:var(--ink);margin:0 0 6px;line-height:1.5}
.meta{font-size:13px;color:var(--muted);margin:2px 0 0}
.time{font-size:13px;font-weight:800;color:var(--teal);white-space:nowrap}

.flight-route{display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.flight-route .leg-end{flex:1;min-width:0}
.flight-route b{display:block;font-size:13px}
.flight-route span{display:block;font-size:11px;color:var(--muted)}
.flight-route i{flex:0 0 auto;color:var(--coral);font-style:normal;font-weight:800}

.rental-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.rental-row:first-of-type{border-top:0}
.rental-row .r-time{font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap}
.rental-row .r-place{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}

.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.link-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;line-height:1;
  padding:7px 10px;
  color:var(--navy);
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  text-decoration:none;
  white-space:nowrap;
}
.link-btn:hover{border-color:var(--teal);color:var(--teal)}
.link-btn svg{flex:0 0 auto}

.day-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:10px;
  overflow:hidden;
}
.day-head{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 14px;
  background:none;
  border:0;
  text-align:left;
  cursor:pointer;
  font:inherit;
  color:inherit;
}
.day-head:hover{background:#f7fafc}
.day-badge{
  width:42px;height:42px;flex:0 0 auto;
  border-radius:var(--radius);
  background:var(--teal-soft);
  color:var(--teal);
  font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.day-card.is-today .day-badge{background:var(--coral);color:#fff}
.day-card.is-past .day-badge{background:#e8edf1;color:#8a99a6}
.day-title{flex:1;min-width:0}
.day-title b{display:block;font-size:15px;line-height:1.3}
.day-title span{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-pill{
  flex:0 0 auto;
  font-size:11px;font-weight:800;color:#fff;
  background:var(--coral);border-radius:999px;padding:4px 8px;
}
.chev{
  flex:0 0 auto;width:22px;height:22px;color:var(--muted);
  transform:rotate(0deg);transition:transform .2s ease;
}
.day-card.open .chev{transform:rotate(180deg)}
.day-body{display:none;padding:2px 14px 10px;border-top:1px dashed var(--line)}
.day-card.open .day-body{display:block}
.day-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px dashed var(--line);
}
.day-item:last-child{border-bottom:0}
.item-icon{
  width:28px;height:28px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:var(--teal-soft);color:var(--teal);
}
.item-main{flex:1;min-width:0}
.item-title{display:block;font-size:13px;font-weight:700}
.item-meta{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.item-meta b{color:var(--ink);font-weight:700}
.day-item.free{background:#fbf7ef;border-radius:6px;padding:10px}
.day-item.free .item-icon{background:#f7e8c8;color:#9a6a12}
.day-note{font-size:12px;color:var(--muted);margin:8px 0 0}

.sight-group{margin-top:14px}
.sight-group h3{
  margin:0 0 10px;
  font-size:15px;
  color:var(--navy);
  letter-spacing:0;
}

@media (max-width:900px){
  .cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .masthead{flex-direction:row;align-items:center;gap:8px;padding:10px 12px}
  .masthead nav{gap:4px}
  .masthead nav button{font-size:11px;padding:6px 7px}
  .brand{gap:8px}
  .brand b{font-size:14px}
  .cols-4,.cols-3,.cols-2{grid-template-columns:1fr}
  .now-title{font-size:24px}
  .countdown{gap:6px}
  .cd-cell{padding:10px 4px 8px}
  .section-head{flex-direction:column;align-items:flex-start;gap:2px}
  .day-head{gap:9px}
  .day-badge{width:38px;height:38px}
  .rental-row{flex-wrap:wrap}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .chev{transition:none}
}
</style>
</head>
<body>
<header class="masthead wrap">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l4 8 5-5 5 15H2L8 3z"/></svg>
    </span>
    <span><b>北欧之旅</b></span>
  </div>
  <nav role="tablist" aria-label="内容分区">
    <button type="button" class="tab-btn active" data-tab="home" id="tab-home" role="tab" aria-selected="true">行程</button>
    <button type="button" class="tab-btn" data-tab="flights" id="tab-flights" role="tab" aria-selected="false">航班</button>
    <button type="button" class="tab-btn" data-tab="hotels" id="tab-hotels" role="tab" aria-selected="false">酒店</button>
    <button type="button" class="tab-btn" data-tab="rentals" id="tab-rentals" role="tab" aria-selected="false">租车</button>
    <button type="button" class="tab-btn" data-tab="sights" id="tab-sights" role="tab" aria-selected="false">景点</button>
  </nav>
</header>

<main class="wrap">
  <div class="tab-panel" id="panel-home" role="tabpanel" aria-labelledby="tab-home">
    <section class="now-card" id="now">
      <p class="now-eyebrow" id="nowEyebrow">下一站</p>
      <h1 class="now-title" id="nowTitle">CA911 · 北京 → 斯德哥尔摩</h1>
      <p class="now-meta" id="nowMeta">9/23 14:00 · 北京首都机场 T3 起飞</p>
      <div class="countdown" id="countdown">
        <div class="cd-cell"><b id="cdD">--</b><span>天</span></div>
        <div class="cd-cell"><b id="cdH">--</b><span>小时</span></div>
        <div class="cd-cell"><b id="cdM">--</b><span>分</span></div>
        <div class="cd-cell"><b id="cdS">--</b><span>秒</span></div>
      </div>
    </section>

    <section class="section" id="days">
      <div class="section-head">
        <h2>行程</h2>
        <span id="daySectionHint"></span>
      </div>
      <div id="dayList"></div>
    </section>
  </div>

  <div class="tab-panel" id="panel-flights" role="tabpanel" aria-labelledby="tab-flights" hidden>
    <section class="section" id="flights">
      <div class="section-head">
        <h2>航班</h2>
        <span>6 段飞行</span>
      </div>
      <div class="grid cols-2" id="flightList"></div>
    </section>
  </div>

  <div class="tab-panel" id="panel-hotels" role="tabpanel" aria-labelledby="tab-hotels" hidden>
    <section class="section" id="hotels">
      <div class="section-head">
        <h2>酒店与住宿</h2>
        <span>10 处住宿 · 13 晚</span>
      </div>
      <div class="grid cols-4" id="hotelList"></div>
    </section>
  </div>

  <div class="tab-panel" id="panel-rentals" role="tabpanel" aria-labelledby="tab-rentals" hidden>
    <section class="section" id="rentals">
      <div class="section-head">
        <h2>租车</h2>
        <span>2 段自驾</span>
      </div>
      <div class="grid cols-2" id="rentalList"></div>
    </section>
  </div>

  <div class="tab-panel" id="panel-sights" role="tabpanel" aria-labelledby="tab-sights" hidden>
    <section class="section" id="sights">
      <div class="section-head">
        <h2>景点与活动</h2>
      </div>
      <div class="sight-group">
        <h3>户外</h3>
        <div class="grid cols-3" id="sightList-outdoor"></div>
      </div>
      <div class="sight-group">
        <h3>城市</h3>
        <div class="grid cols-3" id="sightList-city"></div>
      </div>
    </section>
  </div>
</main>

function localDateKey(now){
  const d = now || new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

function zonedEpoch(dateStr, timeStr, tz){
  const [y, m, d] = dateStr.split('-').map(Number);
  const [hh, mm] = timeStr.split(':').map(Number);
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
  });
  const read = when => {
    const parts = dtf.formatToParts(when);
    const v = {};
    parts.forEach(p => { if (p.type !== 'literal') v[p.type] = Number(p.value); });
    return v;
  };
  const candidate = Date.UTC(y, m-1, d, hh, mm, 0);
  const first = read(candidate);
  const localAsUtc = Date.UTC(first.year, first.month-1, first.day, first.hour, first.minute, first.second);
  const offset = localAsUtc - candidate;
  const epoch = candidate - offset;
  const check = read(epoch);
  if (check.year === y && check.month === m && check.day === d && check.hour === hh && check.minute === mm) return epoch;
  const alt = read(candidate - 86400000);
  const altLocal = Date.UTC(alt.year, alt.month-1, alt.day, alt.hour, alt.minute, alt.second);
  const altOffset = altLocal - (candidate - 86400000);
  return candidate - altOffset;
}

const startUtc = Date.parse('2026-09-23T00:00:00Z');
const endUtc = Date.parse('2026-10-07T12:00:00Z');
const zonedEvents = EVENTS.map(e => ({...e, start: zonedEpoch(e.date, e.time, e.tz)})).sort((a, b) => a.start - b.start);

function dayCardHtml(d, isToday, open){
  const today = localDateKey();
  const statusClass = isToday ? 'is-today' : (d.dateKey < today ? 'is-past' : '');
  const items = d.items.map(it => {
    const links = it.link ? `
      <div class="actions">
        <a class="link-btn" href="${it.link}" target="_blank" rel="noopener">${icon('pin')}地图</a>
        <a class="link-btn" href="${navUrl(it.place)}" target="_blank" rel="noopener">${icon('nav')}导航</a>
      </div>` : '';
    return `
      <div class="day-item${it.free ? ' free' : ''}">
        <span class="item-icon">${icon(it.icon)}</span>
        <div class="item-main">
          <span class="item-title">${it.title}</span>
          <span class="item-meta">${it.time ? '<b>' + it.time + '</b> · ' : ''}${it.place}</span>
        </div>
        ${links}
      </div>`;
  }).join('');
  const pill = isToday ? '<span class="today-pill">今日</span>' : '';
  return `
    <article class="day-card${statusClass ? ' ' + statusClass : ''}${open ? ' open' : ''}" data-day="${d.id}">
      <button class="day-head" aria-expanded="${open ? 'true' : 'false'}">
        <span class="day-badge">${d.id}</span>
        <span class="day-title">
          <b>${d.date} · ${d.week} · ${d.place}</b>
        </span>
        ${pill}
        ${icon('chevron')}
      </button>
      <div class="day-body">${items}</div>
    </article>`;
}

function bindDayToggles(){
  document.querySelectorAll('.day-head').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.day-card');
      const open = card.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
}

function renderDays(){
  const now = Date.now();
  const today = localDateKey();
  const tripEnded = now > endUtc;
  const todayIdx = DAYS.findIndex(d => d.dateKey === today);
  const hintEl = document.getElementById('daySectionHint');
  const html = DAYS.map((d, i) => dayCardHtml(d, !tripEnded && i === todayIdx, true)).join('');
  hintEl.textContent = tripEnded ? '14 天行程回顾' : (todayIdx >= 0 ? '今日 ' + DAYS[todayIdx].id + ' · 全部展开' : '14 天行程 · 全部展开');
  document.getElementById('dayList').innerHTML = html;
  bindDayToggles();
}

function setupTabs(){
  const buttons = Array.from(document.querySelectorAll('.tab-btn'));
  const panels = buttons.map(b => document.getElementById('panel-' + b.dataset.tab));
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach((b, i) => {
        const on = b === btn;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        panels[i].hidden = !on;
      });
      const panel = document.getElementById('panel-' + btn.dataset.tab);
      if (panel && typeof panel.scrollIntoView === 'function'){
        panel.scrollIntoView({behavior:'smooth', block:'start'});
      }
    });
  });
}

function updateNow(){
  const now = Date.now();
  const future = zonedEvents.filter(e => e.start > now && ['flight', 'pickup', 'return', 'hotel'].includes(e.kind));
  const next = future.length ? future[0] : null;
  const titleEl = document.getElementById('nowTitle');
  const metaEl = document.getElementById('nowMeta');
  const eyebrowEl = document.getElementById('nowEyebrow');

  if (now > endUtc){
    eyebrowEl.textContent = '旅程已结束';
    titleEl.textContent = '欢迎回家';
    metaEl.textContent = '北欧之旅 · 行程完成';
    clearCountdown();
    return;
  }
  if (!next){
    eyebrowEl.textContent = '旅程预计';
    titleEl.textContent = '行程即将开始';
    metaEl.textContent = '9/23 从北京出发';
    clearCountdown();
    return;
  }

  eyebrowEl.textContent = '下一站';
  titleEl.textContent = next.title;
  metaEl.textContent = `${next.date.slice(5).replace('-', '/')} ${next.time} · ${next.sub}`;
  const diff = next.start - now;
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor(diff / 3600000) % 24;
  const mins = Math.floor(diff / 60000) % 60;
  const secs = Math.floor(diff / 1000) % 60;
  document.getElementById('cdD').textContent = String(days).padStart(2, '0');
  document.getElementById('cdH').textContent = String(hours).padStart(2, '0');
  document.getElementById('cdM').textContent = String(mins).padStart(2, '0');
  document.getElementById('cdS').textContent = String(secs).padStart(2, '0');
}

function clearCountdown(){
  ['cdD','cdH','cdM','cdS'].forEach(id => document.getElementById(id).textContent = '00');
}

renderFlights();
renderRentals();
renderHotels();
renderSights();
renderDays();
setupTabs();
updateNow();
setInterval(updateNow, 1000);
</script>
